[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imodulator"
version = "1.0.2"
authors = [
  { name="Duarte Silva", email="d.j.fernandes.da.silva@tue.nl" },
  { name="Ali Kaan Sünnetçioğlu", email="a.k.sunnetcioglu@tue.nl" }
]
maintainers = [
  { name="Duarte Silva", email="d.j.fernandes.da.silva@tue.nl" },
  { name="Ali Kaan Sünnetçioğlu", email="a.k.sunnetcioglu@tue.nl" }
]
description = "An all-in-one photonic electro-optic modulator design tool with complete modularity providing consistent optical mode solving, charge transport simulations, RF mode solving and transmission line analysis for arbitrary materials and cross sections."
readme = "README.md"
requires-python = ">=3.11,<3.12"
classifiers = [
    "Programming Language :: Python :: 3",
]
license = {file = "LICENSE"}
keywords = ["integrated photonics", "electro-optic modulators", "photonics simulation", "optical mode solver", "rf mode solver", "charge transport simulation", "electro-optic interaction"]
dependencies = [
    "scikit-fem>=12.0.0",
    "matplotlib==3.9.0",
    "numpy>=2.2.6",
    "Pint>=0.24",
    "scipy==1.13.1",
    "shapely>=2.1.2",
    "pyyaml==6.0.2",
    "pandas==2.3.0",
    "openbandparams>=1.0",
    "pygmsh>=7.1.17",
]

[project.optional-dependencies]
# Optical and RF mode solving (OpticalSimulatorFEMWELL, RFSimulatorFEMWELL,
# ElectroOpticalSimulator). Install with: pip install imodulator[femwell]
femwell = ["femwell==0.1.11"]
# Solcore-based charge transport (ChargeSimulatorSolcore). Install with:
# pip install imodulator[solcore]
solcore = ["solcore>=5.10.1"] # solcore depends on solsesame==2.1a1 (a pre-release); if install fails, add --prerelease=allow
# nextnano-based charge transport (ChargeSimulatorNN). Install with:
# pip install imodulator[nextnanopy]
nextnanopy = ["nextnanopy>=1.2.0"]
all = ["imodulator[femwell,solcore,nextnanopy]"]
# Formatting toolchain. Install with: pip install -e ".[dev]"
dev = ["ruff==0.16.1"]

[project.urls]
Homepage = "https://github.com/duarte-jfs/Imodulator"
Documentation = "https://imodulator.readthedocs.io/en/latest/"
Repository = "https://github.com/duarte-jfs/Imodulator"


[tool.hatch.build.targets.wheel]
packages = ["src/imodulator"]          # <--- ensures Python package is installed
include = [
    "imodulator/**/*.yaml",
    "imodulator/**/*.yml"
]

[tool.uv]
prerelease = "allow"

[tool.ruff]
line-length = 100
indent-width = 4
extend-exclude = ["build"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
