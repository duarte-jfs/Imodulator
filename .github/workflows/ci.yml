name: CI

on:
  push:
    branches: [main, development, nix-flake]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    strategy:
      # x86_64-linux is the flake's tested target; the aarch64-darwin path is not
      # yet proven, so a red macOS leg must never hide a green Linux one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: cachix/cachix-action@v15
        with:
          name: imodulator
          # Absent on pull requests from forks; cachix then builds read-only
          # instead of failing.
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build the environment
        run: nix build .#default --print-build-logs

      - name: Smoke tests
        run: nix develop --command python tests/smoke_test.py
